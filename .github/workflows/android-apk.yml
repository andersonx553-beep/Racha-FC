name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: npm run web:prepare

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android app icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#080808' --iconBackgroundColorDark '#080808' --splashBackgroundColor '#080808' --splashBackgroundColorDark '#080808'

      - name: Configure Google/Firebase plugin
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/variables.gradle")
          s = p.read_text()
          if "rgcfaIncludeGoogle" not in s:
              s = s.replace("ext {", "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
          p.write_text(s)
          PY

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Secret GOOGLE_SERVICES_JSON não configurado."
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path

          raw = os.environ["GOOGLE_SERVICES_JSON"].strip()

          # Aceita JSON puro e também colagens acidentais com code fence/texto ao redor.
          if raw.startswith("```"):
              lines = raw.splitlines()
              if lines and lines[0].startswith("```"):
                  lines = lines[1:]
              if lines and lines[-1].strip().startswith("```"):
                  lines = lines[:-1]
              raw = "\n".join(lines).strip()

          first, last = raw.find("{"), raw.rfind("}")
          if first >= 0 and last > first:
              raw = raw[first:last+1]

          # Se o secret foi salvo como uma string JSON escapada, desembrulha uma vez.
          try:
              parsed = json.loads(raw)
              if isinstance(parsed, str):
                  parsed = json.loads(parsed)
          except json.JSONDecodeError as e:
              print(f"GOOGLE_SERVICES_JSON inválido: {e}")
              raise SystemExit(1)

          expected = "com.rachadograxinha.app"
          clients = parsed.get("client", [])
          packages = [
              x.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for x in clients
          ]
          if expected not in packages:
              print(f"Package esperado {expected} não encontrado no google-services.json.")
              raise SystemExit(1)

          out = Path("android/app/google-services.json")
          out.write_text(json.dumps(parsed, ensure_ascii=False, indent=2) + "\n")
          print("google-services.json validado e normalizado com sucesso.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show debug signing fingerprints
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | tee android/debug-signing.txt
          {
            echo "## Assinatura do APK Debug"
            echo '~~~'
            grep -E "SHA1:|SHA-256:" android/debug-signing.txt || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Racha-do-Graxinha-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/debug-signing.txt
          if-no-files-found: error
