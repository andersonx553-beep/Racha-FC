name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: npm run web:prepare

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android app icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#080808' --iconBackgroundColorDark '#080808' --splashBackgroundColor '#080808' --splashBackgroundColorDark '#080808'

      - name: Configure Google/Firebase plugin
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/variables.gradle")
          s = p.read_text()
          if "rgcfaIncludeGoogle" not in s:
              s = s.replace("ext {", "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
          p.write_text(s)
          PY

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Secret GOOGLE_SERVICES_JSON não configurado."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show debug signing fingerprints
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | tee android/debug-signing.txt
          {
            echo "## Assinatura do APK Debug"
            echo '~~~'
            grep -E "SHA1:|SHA-256:" android/debug-signing.txt || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Racha-do-Graxinha-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/debug-signing.txt
          if-no-files-found: error
